[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "razorbrain"
version = "0.1.0"
description = "AI-powered transaction risk management for defensive fraud detection."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "model*", "evaluation*", "backend*"]
